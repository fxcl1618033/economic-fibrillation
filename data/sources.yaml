  - id: owid_energy
    what: Our World in Data energy dataset, legacy release (no longer updated; built from the Energy Institute Statistical Review of World Energy 2025 and The Shift Data Portal 2019). Used - oil_production (TWh) and oil_consumption (primary energy consumption from oil, TWh) by country
    repo: owid/energy-data
    dir: owid_energy
    commit: f8de88a4f6f9cab44f1cf606047cbd6c4414042c   # 2026-10-01. The repository now holds the frozen legacy release; its README says the dataset is moving to catalog.ourworldindata.org with a changed primary-energy methodology (not pinnable by commit)
    files:
      - path: owid-energy-data.csv
        sha256: 266f2e2baad7975351bc9bb4aa061d22b1da9fe4c47d51d2ac6071e01e171f76
        bytes: 9229369
      - path: owid-energy-codebook.csv
        sha256: 3cc9b7db0d921496e2988568ce3aee5ed41f50431dd234a0663b5f0a4b2e32bb
