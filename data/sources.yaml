    used_by: GNN G0 oil edges - net oil exports as a share of GDP (approved by Sid, 13 October 2026)
    cite: Our World in Data, Energy dataset (legacy release), github.com/owid/energy-data, commit f8de88a; Energy Institute, Statistical Review of World Energy 2025; The Shift Data Portal (2019).

  - id: wb_gdp_current_usd
