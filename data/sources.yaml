    repo: datasets/gdp
    dir: wbgdp
    commit: 36d761dc5617982d3e50b213e02b9a1b47c4e958   # 2026-07-27; reproduces paper1/results/crisis_results.json exactly
    files:
      - path: data/gdp.csv
        sha256: 8d84ef6bcaccf740c01c5ed7566aae8f7b149d0e2c20001e441efd3cb5b2fa86
        bytes: 562767
    used_by: paper1/scripts/eraA_claude_ai/crisis_analysis.py (reads gdp.csv); prepare_data.py built paper1/data/gdp_panel_*.csv from it; GNN G0 edge-weight denominators on 13 October 2026 only (replaced by wb_wdi_gdp_2026_10 on 14 October; still read for the vintage comparison); its gaps for S31 in 1970-2022 are Brazil 1970-1988, Iran 1991-1992 and Russia before 1988

downloads:
  # Files downloaded once from official sources on Sid's Mac (approved by Sid, 11 October 2026). Their URLs serve the
  # latest release, so a new download would differ: never re-fetch silently. tools/fetch_data.py verifies them and,
  # when one is missing, restores it from `archive` (a copy on Sid's Mac) or from the gzip copy in data/archive/.
  - id: bis_lbs
    what: BIS Locational Banking Statistics, bulk file, all series (cross-border bank claims and liabilities by reporting and counterparty country), bulk file of 10 June 2026 from the end-December 2025 release, with data from 1977-Q4 to 2025-Q4. Values in millions of US dollars
    release: "Statistical release: BIS international banking statistics and global liquidity indicators at end-December 2025, 30 April 2026 (https://www.bis.org/statistics/rppb2604.htm). The bulk file inside the zip is dated 2026-06-10; the next release (end-March 2026) came on 31 July 2026"
    url: https://data.bis.org/static/bulk/WS_LBS_D_PUB_csv_col.zip   # listed on https://data.bis.org/bulkdownload
    downloaded: 2026-07-15           # by Sid
    refetch: The URL always serves the newest vintage (on 11 October 2026 the bulk page listed a file dated 14 Sept 2026, with data to end-March 2026), and the BIS does not list older vintages of the bulk file. If the pinned copy is lost, download the current file from this URL, pin it here with its release name, date and new checksums, and rerun everything built on it - the bank edges will change through added quarters and revisions. Sid keeps a backup of data/raw/bis (11 October 2026)
    dir: bis
    archive: ~/data/raw/bis   # Sid's July download: the pinned copy (too large for git)
    optional: true                           # needed only for the GNN (G0); a missing file warns, a changed file fails
    files:
      - path: WS_LBS_D_PUB_csv_col.zip
        sha256: 7e4865ed8d0011de627ded55aaa2e9d3a5665089cb925b15e2e14962dbf9c18a
        bytes: 121177971
      - path: WS_LBS_D_PUB_csv_col.csv
        from_zip: WS_LBS_D_PUB_csv_col.zip
        sha256: f6f096de557fda577cf6194ed4640d747eec9fd1537aa83b0a3e8614c34e86e3
        bytes: 534063740
    read_with: one row per series, quarters as columns. Cross-border claims of all reporting banks on all sectors - FREQ=Q, L_MEASURE=S, L_POSITION=C, L_INSTR=A, L_DENOM=TO1, L_CURR_TYPE=A, L_PARENT_CTY=5J, L_REP_BANK_TYPE=A, L_CP_SECTOR=A (B for banks only), L_POS_TYPE=N; lender = L_REP_CTY, borrower = L_CP_COUNTRY (BIS two-letter codes). Bilaterally the file has L_CP_SECTOR A (all sectors) and N (non-banks) only; B (banks) exists for totals such as L_CP_COUNTRY=5J (all countries), not by counterparty country
    coverage_S30: lenders reporting bilateral claims on S30 economies - 10 from 1977-Q4 (FR, BE, SE, CH, DE, DK, NL, US, GB, JP; the main edge set), then FI 1983, AU 1997, BR 2002, GR and MX 2003, KR 2005, AT and CA 2007, ZA 2009, ES 2012, IT 2014. Never lenders - CN, IN, ID, IR, NO, PT, SA, TH, TR
    used_by: GNN G0 bank-lending edges (main set fixed to the 10 lenders since 1977; the expanding set as sensitivity only - Sid, 11 October 2026)
    cite: Bank for International Settlements, Locational Banking Statistics, data.bis.org (release of June 2026).

  - id: imf_imts
    what: IMF International Trade in Goods by partner country (IMTS, formerly Direction of Trade Statistics), annual, goods exports FOB (XG_FOB_USD) and imports CIF (MG_CIF_USD) in US dollars, 1948-2025. Reporters and partners - the 30 S30 economies plus Belgium-Luxembourg (TX126, Belgium before 1997) and the South African Common Customs Area (TX198, South Africa before 1998); the world (G001) as a partner for totals
    url: see query_url.txt (SDMX 3.0, https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/IMTS/+/<reporters>.XG_FOB_USD+MG_CIF_USD.<partners>+G001.A, header Accept application/vnd.sdmx.data+csv;version=2.0.0)
    downloaded: 2026-10-11T06:30:40Z
    dir: imf_imts
    files:
      - path: IMTS_S30_annual.csv
        sha256: 782a437d7c44cb04bcc464d9aef94acd114e794315181698042b38350ca0876f
        bytes: 10602840
      - path: IMTS_structure.json     # the dataflow's structure and codelists, retrieved the same day
        sha256: dd34fba0ea1a0c0a3dd14c3da473a8070fd61401b8ee4692b6c9dd0f7959678a
        bytes: 897836
      - path: query_url.txt
        sha256: 28c673f56d6c6512f89ff875369e609f5cb8776305379e29519a475a2aa8adc3
        bytes: 360
    read_with: SDMX-CSV 2.0; columns COUNTRY (reporter), INDICATOR, COUNTERPART_COUNTRY, TIME_PERIOD, OBS_VALUE (US dollars); STATUS 'e' marks IMF estimates (1,346 of 131,093 rows). Read with low_memory=False
    coverage_S30: directed pairs with exports or mirror imports - 834 of 870 in 1970, 856 in 1975, 858-859 in 1982-1991, all 870 from 2000. Missing 1970 pairs mostly involve China (16), many of them true zeros (embargoes), not gaps
    used_by: GNN G0 trade edges
    cite: International Monetary Fund, International Trade in Goods (by partner country) (IMTS), data.imf.org, retrieved 11 October 2026.

  - id: imf_imts_s31
    what: IMF International Trade in Goods by partner country (IMTS), annual, goods exports FOB (XG_FOB_USD) and imports CIF (MG_CIF_USD) in US dollars. Reporters and partners - the 31 S31 economies, the USSR (SUN, before 1992), Belgium-Luxembourg (TX126) and the South African Common Customs Area (TX198); the world (G001) as a partner. A superset of imf_imts for pre-registration amendment 3 (Russia; approved by Sid, 13 October 2026)
    url: see query_url.txt (SDMX 3.0, same endpoint and header as imf_imts)
    downloaded: 2026-10-13T15:35:09Z
    dir: imf_imts_s31
    files:
      - path: IMTS_S31_annual.csv
        sha256: abdf03ba742ba4b7394ea7037bd48d6c6ee49ffbd34b8c9437f6ce9517c46282
        bytes: 11181386
      - path: query_url.txt
        sha256: 00c153f7bc7dead0540c857535e779894ae4a0c407f289246d1b9b8717d5fe27
        bytes: 375
    read_with: as imf_imts (the dataflow structure is IMTS_structure.json there)
    check: its rows without RUS or SUN are identical to imf_imts (all 131,093 rows and values), so the IMF made no revision between the two downloads
    coverage_russia: Russia (RUS) as reporter and partner 1992-2025, with all 31 others; the USSR (SUN) as reporter 1955-1991 and as partner 1948-1998
    coverage_russia_bis: in bis_lbs Russia is a borrower only - the 10 main lenders report claims on Russia from 1993-Q4 (11 more later); Russia reports no bilateral claims by counterparty, so it is never a lender
    used_by: GNN G0 trade edges for S31
    cite: International Monetary Fund, International Trade in Goods (by partner country) (IMTS), data.imf.org, retrieved 13 October 2026.

  - id: eia_intl
    what: U.S. Energy Information Administration (EIA), International Energy Statistics, bulk file of every international series (JSON lines, one series per line). Used - annual crude oil including lease condensate production (INTL.57-1-<ISO3>-TBPD.A) and natural gas plant liquids production (INTL.58-1-<ISO3>-TBPD.A), thousand barrels a day, 1980-2025; '--' = not available
    url: https://www.eia.gov/opendata/bulk/INTL.zip   # listed on https://www.eia.gov/opendata/bulkfiles.php (https://api.eia.gov/bulk/INTL.zip redirects here); no API key needed
    release: zip Last-Modified 2026-10-03 09:49 GMT; series last updated up to 2026-09-30 (104,434 series)
    downloaded: 2026-10-13T17:30:37Z
    refetch: The URL always serves the newest file and the EIA keeps no older bulk vintages. If the pinned copy is lost it is restored from data/archive/eia_intl; a new download must be pinned anew and everything built on it rerun
    dir: eia_intl
    files:
      - path: INTL.zip
        sha256: 9251a5920ebe70448fc7af522c4f938dc9e1f4728aca2928ecc814ca9f216ea9
        bytes: 24153479
      - path: INTL.txt
        from_zip: INTL.zip
        sha256: d664246b3f9080a980da481049b474fe0d9a89e3f0b06552dc7d284a9f0b40e1
        bytes: 128799698
    read_with: json.loads per line; series lines have series_id, units and data = [[year, value], ...]. Production comparable with the Energy Institute's (crude, condensates and NGLs) = series 57 + series 58; 59 (other liquids - biofuels, coal-, gas-derived) and refinery gain are left out
    used_by: GNN G0 oil edges - oil production 2017-2022 for economies whose Our World in Data production ends in 2016, only where EIA and OWID agree over 1980-2016 within the tolerance fixed in docs/decisions.md before the comparison (approved by Sid, 13 October 2026); corroborates the true-zero producers
    cite: U.S. Energy Information Administration, International Energy Statistics, bulk download INTL.zip, retrieved 13 October 2026.

  - id: wb_wdi_gdp_2026_10
    what: World Bank World Development Indicators, GDP in current US dollars (NY.GDP.MKTP.CD), all economies, 1960-2025, the API's CSV download (WDI last updated 2026-10-08)
    url: https://api.worldbank.org/v2/en/indicator/NY.GDP.MKTP.CD?downloadformat=csv   # serves API_NY.GDP.MKTP.CD_DS2_en_csv_v2_512.zip
    downloaded: 2026-10-13T17:30:40Z
    refetch: The URL serves the latest WDI vintage. If lost, restored from data/archive/wb_wdi_gdp
    dir: wb_wdi_gdp
    files:
      - path: API_NY.GDP.MKTP.CD_DS2_en_csv_v2_512.zip
        sha256: ec349303c263d3b36924e83a9780e5002ce7a1809ecaf29e7829db946ec01d81
        bytes: 142891
      - path: API_NY.GDP.MKTP.CD_DS2_en_csv_v2_512.csv
        from_zip: API_NY.GDP.MKTP.CD_DS2_en_csv_v2_512.zip
        sha256: 34a2a6cc0e286469a0c3635693499981abe6efaa8bf964711201a3be3f138ad0
        bytes: 297580
      - path: Metadata_Country_API_NY.GDP.MKTP.CD_DS2_en_csv_v2_512.csv
        from_zip: API_NY.GDP.MKTP.CD_DS2_en_csv_v2_512.zip
        sha256: eb2b248a5a2dd23d0238b210475ca8a3753d0ae7b1207828c7db377c592880a1
        bytes: 65232
      - path: Metadata_Indicator_API_NY.GDP.MKTP.CD_DS2_en_csv_v2_512.csv
        from_zip: API_NY.GDP.MKTP.CD_DS2_en_csv_v2_512.zip
        sha256: efb0ab0c9e3752f4d806a261014cee65304917e89386bbed8911386c33e188be
        bytes: 788
    read_with: skip the first 4 lines; one row per economy, years as columns
    check: it does NOT match wb_gdp_current_usd exactly where both have data. For S31 in 1970-2022, of 1,604 economy-years in both, 598 are identical (to 1e-9), 153 differ by at most 0.1% and 853 by more (317 by more than 1%); 29 of the 31 economies have at least one revision above 0.1% and 16 have them in at least half their years (national-accounts revisions and rebasings); the largest are Turkey (up to 39%), Iran (25%) and Saudi Arabia (12%). Brazil matches except 1989 (-3.0%). It adds Brazil 1970-1988 and Iran 1991-1992
    used_by: GNN G0 edge-weight denominators from 14 October 2026 (Sid chose option b, every denominator from this vintage, after the exact-match condition failed); gaps for S31 in 1970-2022 - Russia before 1988 only
    cite: World Bank, World Development Indicators, NY.GDP.MKTP.CD, retrieved 13 October 2026.

not_pinned:
  - id: jst_xlsx
    what: Jordà–Schularick–Taylor Macrohistory Database (jst.xlsx), used only by crisis_dating_test.py (banking-crisis dating, superseded)
    status: original download not recorded; macrohistory.net was unreachable from the sandbox. GMD's data/clean/aggregators/JST/JST.dta is the candidate replacement. crisis_dating_results.json has not been re-verified.
  - id: kose_terrones_dates
    what: Global recession years 1975, 1982, 1991, 2009, 2020 and downturns 1998, 2001, 2012 (Kose, Sugawara and Terrones)
    status: hard-coded constants, not a file. Cite Kose, Sugawara and Terrones (2020), Global Recessions, World Bank Policy Research Working Paper 9172.

