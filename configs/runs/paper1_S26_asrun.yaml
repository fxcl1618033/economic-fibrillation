# Paper 1 exactly as it was run: S26, Maddison 2023, each test with the phase convention, window and seed of its
# as-run script. This is the configuration that must reproduce tests/golden_paper1.json (HANDOFF.md Phase 2).
# Phase 3 runs the same tests with convention P throughout, on S26 and S30 (configs to be pre-registered).

name: paper1_S26_asrun
sample: S26
band: [9.0, 0.49]              # longest period (years), highest frequency (cycles a year): 2.04-9 years
span: [1950, 2022]             # the band-pass run-in
window: [1970, 2022]           # statistics
recessions: [1975, 1982, 1991, 2009, 2020]
downturns: [1998, 2001, 2012]

tests:
  arc:              {convention: P, bootstrap: 10000, seed: 11}                       # kose_terrones_test.py
  conventions:      {conventions: [P, W, N], detrend_sigma: 8.0}                      # tools/check_runin_conventions.py
  amplitude:        {convention: W, detrend_sigma: 8.0, surrogates: 5000, seed: 404, batch: 250}       # amplitude_test.py
  diversification:  {win: 10, weights: [gdp_end, gdp_mean, equal], surrogates: 5000, seed: 707, batch: 200}  # diversification*.py
  cross_split:      {win: 10}                                                          # crossterm_split.py
  structure:        {convention: P, surrogates: 5000, seed: 909, batch: 250}          # structure_tests.py
  mst:              {window: [1962, 2022], win: 10, pre: 8, surrogates: 5000, seed: 303, batch: 100}  # mst_network.py
  phase_lags:       {convention: W, surrogates: 5000, seed: 505, batch: 250}          # phase_lags.py
  csd:              {convention: W, window: [1962, 2022], win: 15, sigma: 5.0, pre: 8, surrogates: 5000, seed: 101, batch: 250}  # csd_surrogate.py
  bifurcation:      {convention: W, window: [1962, 2022], win: 12, sigma: 5.0, surrogates: 5000, seed: 202, batch: 250}       # kuramoto_bifurcation.py
  robustness:       {convention: P}                                                    # robustness.py
